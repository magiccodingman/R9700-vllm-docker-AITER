services:
  r9700-vllm:
    image: ${IMAGE_NAME:-r9700-vllm:rocm724}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROCM_BASE_IMAGE: ${ROCM_BASE_IMAGE:-rocm/dev-ubuntu-24.04:7.2.4-complete}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/rocm7.2}
        VLLM_FINAL_BRANCH: ${VLLM_FINAL_BRANCH:-r9700-c3284-secondary}
        LAUNCHER_REPO: ${LAUNCHER_REPO:-https://github.com/magiccodingman/VllmLaunchScriptR9700.git}
        LAUNCHER_REF: ${LAUNCHER_REF:-main}
        MAX_JOBS: ${MAX_JOBS:-8}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-7200}
        PIP_RETRIES: ${PIP_RETRIES:-100}
    container_name: ${CONTAINER_NAME:-r9700-vllm}
    network_mode: host
    ipc: host
    shm_size: ${SHM_SIZE:-32gb}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      - ${MODEL_DIR:-/mnt/fastdisk/ai-models}:/models:ro
      - ${CACHE_DIR:-r9700-cache}:/cache
      - ${LOG_DIR:-./logs}:/logs
      # Optional: override the launch script without rebuilding.
      # - ./launch_vllm.py:/opt/r9700-vllm/launcher/launch_vllm.py:ro
    environment:
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0,1}
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:-0,1}
      HSA_FORCE_FINE_GRAIN_PCIE: ${HSA_FORCE_FINE_GRAIN_PCIE:-1}
      HSA_ENABLE_SDMA: ${HSA_ENABLE_SDMA:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      VLLM_LAUNCH_SCRIPT: ${VLLM_LAUNCH_SCRIPT:-/opt/r9700-vllm/launcher/launch_vllm.py}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TORCH_HOME: /cache/torch
      TRITON_CACHE_DIR: /cache/triton
      VLLM_CACHE_ROOT: /cache/vllm
    # Intentionally no model path here. Pass vLLM args at launch time with:
    #   python scripts/r9700-vllm.py serve --model /models/YourModel ...
    command:
      - serve
