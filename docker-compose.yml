services:
  r9700-vllm:
    image: ${IMAGE_NAME:-r9700-vllm:rocm7130-preview}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROCM_BASE_IMAGE: ${ROCM_BASE_IMAGE:-ubuntu:24.04}
        ROCM_VERSION: ${ROCM_VERSION:-7.13.0}
        ROCM_TARBALL_URL: ${ROCM_TARBALL_URL:-https://repo.amd.com/rocm/tarball/therock-dist-linux-gfx120X-all-7.13.0.tar.gz}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://repo.amd.com/rocm/whl/gfx120X-all/}
        PYTORCH_PACKAGES: ${PYTORCH_PACKAGES:-torch==2.11.0+rocm7.13.0 torchvision==0.26.0+rocm7.13.0 torchaudio==2.11.0+rocm7.13.0}
        VLLM_REPO: ${VLLM_REPO:-https://github.com/magiccodingman/vllm-rdna4.git}
        VLLM_REF: ${VLLM_REF:-rdna4-dev}
        MAX_JOBS: ${MAX_JOBS:-8}
        PYTORCH_ROCM_ARCH: ${PYTORCH_ROCM_ARCH:-gfx1201}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-7200}
        PIP_RETRIES: ${PIP_RETRIES:-100}
    container_name: ${CONTAINER_NAME:-r9700-vllm}
    network_mode: host
    ipc: host
    shm_size: ${SHM_SIZE:-32gb}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      - ${MODEL_DIR:-/mnt/fastdisk/ai-models}:/models:ro
      - ${CACHE_DIR:-r9700-cache}:/cache
      - ${LOG_DIR:-./logs}:/logs
    environment:
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0,1}
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:-0,1}
      HSA_FORCE_FINE_GRAIN_PCIE: ${HSA_FORCE_FINE_GRAIN_PCIE:-1}
      HSA_ENABLE_SDMA: ${HSA_ENABLE_SDMA:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TORCH_HOME: /cache/torch
      TRITON_CACHE_DIR: /cache/triton
      VLLM_CACHE_ROOT: /cache/vllm
    # Intentionally no model path here. Pass vLLM args at launch time with:
    #   python scripts/r9700-vllm.py serve --model /models/YourModel ...
    command:
      - serve
